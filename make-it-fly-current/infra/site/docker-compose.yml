# Site público da Apogee. Mantém recursos e rede separados do sistema de locação.
name: apogee-site

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
    image: apogee-site:${APOGEE_RELEASE_SHA:-local}
    restart: unless-stopped
    init: true
    env_file: ${APOGEE_SITE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
    expose:
      - "3000"
    volumes:
      # Certificado público do PgBouncer, nunca a chave privada.
      - ${PGBOUNCER_CA_PATH:-/opt/apogee-membros/certs/server.crt}:/run/apogee/pgbouncer-ca.crt:ro
      - next_cache:/app/.next/cache
    networks: [public, members_edge, radar_bridge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  google-calendar-sync:
    image: apogee-site:${APOGEE_RELEASE_SHA:-local}
    profiles: [google-calendar]
    restart: unless-stopped
    init: true
    environment:
      GOOGLE_CALENDAR_INTERNAL_ORIGIN: http://web:3000
      GOOGLE_CALENDAR_SYNC_SECRET: ${GOOGLE_CALENDAR_SYNC_SECRET:-}
      GOOGLE_CALENDAR_ALERT_WEBHOOK_URL: ${GOOGLE_CALENDAR_ALERT_WEBHOOK_URL:-}
      GOOGLE_CALENDAR_ALERT_STATE_FILE: /app/worker-state/google-calendar-alerts.json
    command: ["node", "scripts/google-calendar-worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    networks: [public]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - google_calendar_worker_state:/app/worker-state
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "scripts/google-calendar-worker.mjs", "--healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  blog-db-proxy:
    profiles: [blog]
    image: edoburu/pgbouncer:v1.26.0-p0
    restart: unless-stopped
    entrypoint: []
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/blog/pgbouncer.ini"]
    volumes:
      - ${APOGEE_BLOG_DB_CONFIG_PATH:-/opt/apogee-blog/db-proxy}:/etc/pgbouncer/blog:ro
      - ${APOGEE_MEMBERS_CERTS_PATH:-/opt/apogee-membros/certs}:/etc/pgbouncer/certs:ro
    networks:
      members_internal: {}
      blog_data:
        aliases: [pgbouncer]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 96m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 15s
      timeout: 5s
      retries: 5

  blog-worker:
    profiles: [blog]
    build:
      context: ../../../blog-worker
      additional_contexts:
        editorial-contract: ../..
      args:
        APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
    image: apogee-blog-worker:${APOGEE_RELEASE_SHA:-local}
    restart: unless-stopped
    init: true
    environment:
      BLOG_DATABASE_URL: ${BLOG_DATABASE_URL:-}
      BLOG_DATABASE_CA_CERT_FILE: /run/apogee/pgbouncer-ca.crt
      BLOG_GOOGLE_CLI_PATH: /usr/local/bin/agy
      BLOG_GOOGLE_CLI_SHA256: ${BLOG_GOOGLE_CLI_SHA256:-}
      BLOG_CONFIG_DIR: /app/config
    volumes:
      - ${PGBOUNCER_CA_PATH:-/opt/apogee-membros/certs/server.crt}:/run/apogee/pgbouncer-ca.crt:ro
      - ${APOGEE_BLOG_CONFIG_PATH:-../../../blog-worker/config}:/app/config:ro
      - ${APOGEE_BLOG_GOOGLE_CLI_PATH:-/opt/apogee-blog/bin/agy}:/usr/local/bin/agy:ro
      # Native CLI profile AND encrypted Linux keyring persist across restarts.
      - ${APOGEE_BLOG_GOOGLE_PROFILE_PATH:-/opt/apogee-blog/home}:/home/node
      - ${APOGEE_BLOG_KEYRING_PASSWORD_PATH:-/opt/apogee-blog/secrets/keyring-password}:/run/apogee/keyring-password:ro
    depends_on:
      blog-db-proxy:
        condition: service_healthy
    networks: [blog_data, blog_outbound]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "src/cli.mjs", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: [public]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  google_calendar_worker_state:
    name: apogee_google_calendar_worker_state
  next_cache:
    name: apogee_site_next_cache
  caddy_data:
    name: apogee_site_caddy_data
  caddy_config:
    name: apogee_site_caddy_config

networks:
  blog_data:
    name: apogee_blog_data
    internal: true
  blog_outbound:
    name: apogee_blog_outbound
  members_internal:
    name: apogee_membros_internal
    external: true
  public:
    name: apogee_site_public
  members_edge:
    name: apogee_membros_edge
    external: true
  # Bridge exclusiva com a API pública do Radar; não dá acesso ao banco Radar.
  radar_bridge:
    name: apogee_radar_bridge
    external: true
