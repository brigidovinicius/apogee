# Site público da Apogee. Mantém recursos e rede separados do sistema de locação.
name: apogee-site

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
        # ID público necessário no `next build`; a chave de servidor nunca é
        # enviada para uma camada de build.
        NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${NEXT_PUBLIC_HEXCLAVE_PROJECT_ID}
    image: apogee-site:${APOGEE_RELEASE_SHA:-local}
    restart: unless-stopped
    init: true
    env_file: ${APOGEE_SITE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    volumes:
      # Certificado público do PgBouncer, nunca a chave privada.
      - ${PGBOUNCER_CA_PATH:-/opt/apogee-membros/certs/server.crt}:/run/apogee/pgbouncer-ca.crt:ro
      - next_cache:/app/.next/cache
    networks: [public, members_edge, radar_bridge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: [public]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  next_cache:
    name: apogee_site_next_cache
  caddy_data:
    name: apogee_site_caddy_data
  caddy_config:
    name: apogee_site_caddy_config

networks:
  public:
    name: apogee_site_public
  members_edge:
    name: apogee_membros_edge
    external: true
  # Bridge exclusiva com a API pública do Radar; não dá acesso ao banco Radar.
  radar_bridge:
    name: apogee_radar_bridge
    external: true
