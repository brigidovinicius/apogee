# Coletor Radar Acadêmico: isolado do site Apogee e de outros projetos da VPS.
name: radar-academico

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RADAR_DB_NAME}
      POSTGRES_USER: ${RADAR_DB_USER}
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD}
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
    image: radar-academico:${APOGEE_RELEASE_SHA:-local}
    restart: unless-stopped
    init: true
    # Lista explícita: o processo web nunca recebe a credencial de bootstrap/migração.
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APOGEE_RELEASE_SHA: ${APOGEE_RELEASE_SHA:-local}
      DATABASE_READER_URL: ${DATABASE_READER_URL:?configure a credencial radar_reader}
      DATABASE_EDITOR_URL: ${DATABASE_EDITOR_URL:?configure a credencial radar_editor}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RADAR_ACADEMICO_API_TOKEN: ${RADAR_ACADEMICO_API_TOKEN:-}
      RADAR_ACADEMICO_ADMIN_API_TOKEN: ${RADAR_ACADEMICO_ADMIN_API_TOKEN:-}
      TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
      INGESTION_MAX_PAGES_PER_RUN: ${INGESTION_MAX_PAGES_PER_RUN:-20}
      INGESTION_REQUEST_DELAY_MS: ${INGESTION_REQUEST_DELAY_MS:-2000}
      INGESTION_MAX_FILE_SIZE_MB: ${INGESTION_MAX_FILE_SIZE_MB:-15}
      INGESTION_CONTACT_EMAIL: ${INGESTION_CONTACT_EMAIL:-contato@apogee.community}
      INGESTION_USER_AGENT: ${INGESTION_USER_AGENT:-RadarAcademicoBot/1.0}
      RADAR_ALERTS_ENABLED: ${RADAR_ALERTS_ENABLED:-false}
      RADAR_RESEND_DOMAIN_VERIFIED: ${RADAR_RESEND_DOMAIN_VERIFIED:-false}
      RADAR_RESEND_API_KEY: ${RADAR_RESEND_API_KEY:-}
      RADAR_RESEND_FROM: ${RADAR_RESEND_FROM:-contato@apogee.community}
      RADAR_ALERTS_DAILY_LIMIT: ${RADAR_ALERTS_DAILY_LIMIT:-50}
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal: {}
      apogee_radar_bridge:
        aliases: [radar-academico]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    image: radar-academico:${APOGEE_RELEASE_SHA:-local}
    restart: unless-stopped
    init: true
    environment:
      RADAR_INTERNAL_ORIGIN: http://web:3000
      CRON_SECRET: ${CRON_SECRET:?configure o segredo do scheduler}
      # Poll for due work every five minutes; per-source schedules remain in PostgreSQL.
      # Override the legacy daily loop setting without changing the shared secrets file.
      INGESTION_INTERVAL_SECONDS: ${RADAR_SCHEDULER_INTERVAL_SECONDS:-300}
    command: ["node", "scripts/run-scheduled-ingestion.mjs"]
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: builder
    profiles: [migrate]
    environment:
      # Credencial elevada fica apenas no perfil explicitamente invocado pelo operador.
      DATABASE_URL: ${DATABASE_MIGRATION_URL:-}
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

volumes:
  radar_pgdata:
    name: radar_academico_pgdata

networks:
  internal:
    name: radar_academico_internal
    internal: true
  apogee_radar_bridge:
    name: apogee_radar_bridge
    external: true
