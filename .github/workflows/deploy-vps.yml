name: Deploy Apogee site to VPS

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA to deploy
        required: true
        type: string
      linear_issue_identifier:
        description: Linear issue to receive the deployment result
        required: false
        default: APG-6
        type: string

permissions:
  contents: read

concurrency:
  group: apogee-site-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site only
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      LINEAR_ISSUE_IDENTIFIER: ${{ inputs.linear_issue_identifier }}
    steps:
      - name: Validate requested revision and configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$VPS_HOST"

      - name: Resolve Linear issue
        id: linear_issue
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$LINEAR_API_KEY"
          test -n "$LINEAR_ISSUE_IDENTIFIER"

          payload=$(jq -cn --arg identifier "$LINEAR_ISSUE_IDENTIFIER" '{query: "query ($identifier: String!) { issue(id: $identifier) { id identifier } }", variables: {identifier: $identifier}}')
          response=$(curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "Authorization: $LINEAR_API_KEY" \
            --data "$payload" \
            https://api.linear.app/graphql)
          test "$(jq -r '.errors | length' <<<"$response")" = 0
          issue_id=$(jq -r '.data.issue.id // empty' <<<"$response")
          test -n "$issue_id"
          printf 'id=%s\n' "$issue_id" >> "$GITHUB_OUTPUT"

      - name: Configure restricted SSH client
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Verify VPS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$VPS_HOST" 'test "$(whoami)" = root && hostname && pwd'

      - name: Deploy only apogee-site web and keep rollback SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$VPS_HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          repo=/opt/apogee-site/repo
          compose_file="$repo/make-it-fly-current/infra/site/docker-compose.yml"
          env_file="$repo/make-it-fly-current/infra/site/.env"

          test -d "$repo/.git"
          test -f "$compose_file"
          test -f "$env_file"
          test "$(stat -c '%a' "$env_file")" = 600

          cd "$repo"
          git diff --quiet
          git diff --cached --quiet
          previous_sha=$(git rev-parse HEAD)
          git fetch --quiet origin "$RELEASE_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git checkout --detach --quiet "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          export APOGEE_RELEASE_SHA="$RELEASE_SHA"
          export APOGEE_SITE_ENV_FILE="$env_file"
          docker compose --env-file "$env_file" -f "$compose_file" config -q

          rollback() {
            git checkout --detach --quiet "$previous_sha"
            export APOGEE_RELEASE_SHA="$previous_sha"
            docker compose --env-file "$env_file" -f "$compose_file" up -d --build web
          }
          trap rollback ERR

          docker compose --env-file "$env_file" -f "$compose_file" up -d --build web

          for attempt in $(seq 1 20); do
            health=$(docker inspect apogee-site-web-1 --format '{{.State.Health.Status}}')
            if test "$health" = healthy; then
              printf 'rollback_sha=%s deployed_sha=%s health=%s\n' "$previous_sha" "$RELEASE_SHA" "$health"
              exit 0
            fi
            sleep 3
          done
          exit 1
          REMOTE

      - name: Probe public login routes
        shell: bash
        run: |
          set -Eeuo pipefail
          members_status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' \
            'https://www.apogee.community/membros/entrar?next=%2Fmembros')
          login_status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' \
            'https://www.apogee.community/login')
          printf 'members_status=%s login_status=%s\n' "$members_status" "$login_status"
          [[ "$members_status" =~ ^[23][0-9][0-9]$ ]]
          [[ "$login_status" =~ ^[23][0-9][0-9]$ ]]

      - name: Publish deployment result to Linear
        if: always() && steps.linear_issue.outputs.id != ''
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ISSUE_ID: ${{ steps.linear_issue.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          body=$(printf 'VPS deploy **%s**. SHA: `%s`. Workflow: %s' "$JOB_STATUS" "$RELEASE_SHA" "$WORKFLOW_URL")
          payload=$(jq -cn --arg issueId "$LINEAR_ISSUE_ID" --arg body "$body" '{query: "mutation ($input: CommentCreateInput!) { commentCreate(input: $input) { success comment { id } } }", variables: {input: {issueId: $issueId, body: $body}}}')
          response=$(curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "Authorization: $LINEAR_API_KEY" \
            --data "$payload" \
            https://api.linear.app/graphql)
          test "$(jq -r '.errors | length' <<<"$response")" = 0
          test "$(jq -r '.data.commentCreate.success' <<<"$response")" = true
